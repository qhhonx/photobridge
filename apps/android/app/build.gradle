plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def releaseInfo = new groovy.json.JsonSlurper().parse(file("../../../release.json"))
android {
    namespace 'app.photobridge'
    compileSdk 36
    ndkVersion "27.1.12297006"
    defaultConfig {
        applicationId 'app.photobridge'
        minSdk 29
        targetSdk 34
        testInstrumentationRunner "app.photobridge.ReceiverInstrumentation"
        versionCode releaseInfo.build as int
        versionName releaseInfo.version
        // Install native acceptance tests beside the user's real receiver.
        if (project.hasProperty('validationApp')) applicationId 'app.photobridge.validation'
        // Isolated update-verification host; never changes the production package.
        if (project.hasProperty('updateFixture')) {
            applicationId 'app.photobridge.updatefixture'
            versionCode = Integer.parseInt(project.findProperty('fixtureBuild')?.toString() ?: '1')
        }
        manifestPlaceholders = [
            appLabel: project.hasProperty('validationApp') ? 'PhotoBridge Validation' : '@string/app_name',
            photosProbeLabel: project.hasProperty('validationApp') ? 'PhotoBridge Validation — Photos space management' : '@string/photos_probe_title'
        ]
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'photobridge'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
        debug { versionNameSuffix '-dev' }
    }
    kotlinOptions { jvmTarget = "17" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.annotation:annotation:1.9.1'; implementation 'com.google.zxing:core:3.5.3'; implementation 'androidx.media3:media3-transformer:1.5.1'; implementation 'androidx.exifinterface:exifinterface:1.3.7' }

dependencies {
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
}
