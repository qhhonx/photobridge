name: PhotoBridge
options:
  minimumXcodeGenVersion: 2.40.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  PhotoBridge:
    type: application
    platform: macOS
    sources:
      - path: PhotoBridge
        excludes: [Info.plist]
      - path: ../apple/Shared
      - path: ../apple/Resources
    dependencies:
      - framework: ../../build/dependencies/sparkle/Sparkle.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.photobridge.mac
        INFOPLIST_FILE: PhotoBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: '-'
        SWIFT_OBJC_BRIDGING_HEADER: ../../crates/native/include/photobridge.h
        OTHER_LDFLAGS:
          - $(inherited)
          - '$(BUILT_PRODUCTS_DIR)/libphotobridge_native.a'
          - -framework
          - Security
          - -framework
          - SystemConfiguration
          - -lsqlite3
          - -lz
          - -liconv
    preBuildScripts:
      - name: Build shared Rust engine
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../.."
          export MACOSX_DEPLOYMENT_TARGET=14.0
          ./scripts/fetch-sparkle.sh
          cargo build --locked --release --target aarch64-apple-darwin -p photobridge-native
          cp target/aarch64-apple-darwin/release/libphotobridge_native.a "$BUILT_PRODUCTS_DIR/"
schemes:
  PhotoBridge:
    build:
      targets:
        PhotoBridge: all
    run:
      config: Debug
