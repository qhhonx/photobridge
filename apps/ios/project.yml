name: PhotoBridge
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  PhotoBridge:
    type: application
    platform: iOS
    sources:
      - path: ../apple/Shared
      - path: ../apple/Resources
      - path: PhotoBridge
        excludes: [Info.plist]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.photobridge.ios
        INFOPLIST_FILE: PhotoBridge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Simulator.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ../../crates/native/include/photobridge.h
        TARGETED_DEVICE_FAMILY: '1,2'
        OTHER_LDFLAGS:
          - $(inherited)
          - '$(BUILT_PRODUCTS_DIR)/libphotobridge_native.a'
          - -framework
          - Security
          - -framework
          - SystemConfiguration
          - -lsqlite3
          - -lz
          - -liconv
    preBuildScripts:
      - name: Build shared Rust engine
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          export IPHONEOS_DEPLOYMENT_TARGET=17.0
          case "$PLATFORM_NAME" in
            iphonesimulator) rust_target=aarch64-apple-ios-sim;;
            iphoneos) rust_target=aarch64-apple-ios;;
            *) exit 1;;
          esac
          cd "$SRCROOT/../.."
          cargo build --locked --release -p photobridge-native --target "$rust_target"
          cp "target/$rust_target/release/libphotobridge_native.a" "$BUILT_PRODUCTS_DIR/"
  PhotoBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PhotoBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.photobridge.tests
        GENERATE_INFOPLIST_FILE: YES
  PhotoBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PhotoBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.photobridge.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhotoBridge:
    build:
      targets:
        PhotoBridge: all
    run:
      config: Debug
    test:
      targets: [PhotoBridgeTests]
  PhotoBridgeUI:
    build:
      targets:
        PhotoBridge: all
        PhotoBridgeUITests: [test]
    test:
      targets: [PhotoBridgeUITests]
