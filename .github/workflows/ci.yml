name: Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node --test site/tests/*.test.mjs
      - run: node --check site/app.js
      - run: python3 scripts/audit-public.py
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy -p photobridge-native --features folder-source --all-targets --locked -- -D warnings
      - run: cargo test -p photobridge-native --features folder-source --locked
      - run: python scripts/check-folder-isolation.py
      - run: cargo build --workspace --locked
      - run: python tests/cli_smoke.py

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup target add aarch64-apple-ios-sim
      - run: scripts/build-ios.sh simulator
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup target add aarch64-apple-darwin
      - run: scripts/build-macos.sh
      - run: scripts/test-folder-native.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: rustup target add aarch64-linux-android
      - run: sdkmanager 'platforms;android-36' 'ndk;27.1.12297006'
      - run: scripts/build-android.sh
      - run: ./gradlew assembleDebugAndroidTest
        working-directory: apps/android
